<!DOCTYPE html>
<html lang="en">
<link>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 900px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .product-list {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .product {
      width: 200px;
      background: #fff;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      text-align: center;
    }

    button {
      padding: 8px 12px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    .totalBox {
      text-align: right;
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    .checkout-box {
      margin-top: 30px;
      padding: 20px;
      background: #eef7ff;
      border-radius: 10px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .success {
      color: green;
      font-size: 18px;
      margin-top: 10px;
    }
  </style>

  <script src="script.js"></script>
</head>
<body>
    <h1>Shopping Cart</h1>

    <div class="container">
        <div class="product">
            <h3>T-shirt</h3>
            <p>₹499</p>
            <button onclick="addToCart(1,'T-Shirt',499)">Add To Cart</button>
        </div>

        <div class="product">
            <h3>Cap</h3>
            <p>₹299</p>
            <button onclick="addToCart(2,'Cap',299)">Add To Cart</button>
        </div>

        <div class="product">
            <h3>Socks</h3>
            <p>₹199</p>
            <button onclick="addToCart(3,'Socks',199)">Add To Cart</button>
        </div>
    </div>

    <table id="cartTable">
        <thread>
            <tr>
                <th>Item</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Total</th>
                <th>Remove</th>
            </tr>
        </thread>
        <tbody></tbody>
    </table>


    <div class="totalBox">
        Subtotal: ₹<span id="subtotal">0</span>
        Tax (18%): ₹<span id="tax">0</span>
        Grand Total: ₹<span id="grandtotal">0</span>
    </div>

    <div class="checkout-box">
        <h3>Checkout</h3>

        <input type="text" id="name" placeholder="Enter Name">
        <input type="email" id="email" placeholder="Enter Email">
        <input type="text" id="address" placeholder="Enter Address">

        <button onclick="checkout()">Place Order</button>

        <p class="success" id="successMsg"></p>
    </div>
</body>
</html>
