<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .modal{
            display:none;
            position: fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background: rgba(214, 14, 14, 0.5);
            justify-content: center;
            align-items:center
        }

        .modal-content{
            background: white;
            padding:20px;
            width:350px;
            border-radius: 10px;
            position: relative;
        }

        .close{
            position:absolute;
            right:15px;
            top:10px;
            cursor:pointer;
            font-size:22px;
        }
    </style>

    <script src="./script.js" defer></script>
</head>
<body>
    <button id="openModalBtn"> Open Modal </button>

    <div id="myModal" class="modal">
        <div class="modal-content">
            <span id="closeModalBtn" class="close">&times;</span>
            <h2>My Modal</h2>
            <p>This is a simple modal in Plain Javascript</p>
        </div>

    </div>
</body>
</html>
