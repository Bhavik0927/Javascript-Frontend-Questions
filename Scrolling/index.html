<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Virtual List (10k items)</title>
  <style>
    body {
      font-family: Arial;
    }

    #container {
      height: 500px;
      width: 300px;
      border: 1px solid #ccc;
      overflow-y: auto;
      position: relative;
    }

    #spacer {
      position: relative;
      width: 100%;
    }

    #list {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }

    .item {
      height: 30px;
      padding: 5px;
      border-bottom: 1px solid #eee;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <h2>Virtualized List (10,000 Items)</h2>

  <div id="container">
    <div id="spacer">
      <div id="list"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
